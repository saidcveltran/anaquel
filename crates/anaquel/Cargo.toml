[package]
name = "anaquel"
description = "Documentation engine for static libraries of books"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "anaquel"
path = "src/main.rs"

[dependencies]
anaquel-diagnostics.workspace = true
anaquel-pipeline.workspace = true
anaquel-preview.workspace = true
anaquel-search.workspace = true
clap.workspace = true

# The crates are not published to crates.io (`publish = false`), but this program is released
# as a binary archive, so dist must not skip it.
[package.metadata.dist]
dist = true

[lints]
workspace = true
