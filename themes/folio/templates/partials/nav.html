{% macro tree(nodes) %}
<ul>
{% for node in nodes %}
  <li{% if node.active %} class="is-active"{% endif %}>
    <a href="{{ node.url }}"{% if node.current %} aria-current="page"{% endif %}>{{ node.title }}</a>
    {% if node.children %}{{ tree(node.children) }}{% endif %}
  </li>
{% endfor %}
</ul>
{% endmacro %}
