{% extends "base.html" %}
{% block shell %}
<main id="content" class="content home">
  <h1>{{ site.title }}</h1>
  {% if site.description %}<p class="lead">{{ site.description }}</p>{% endif %}
  <ul class="cards">
    {% for volume in site.volumes %}
    <li><a href="{{ volume.url }}"><strong>{{ volume.title }}</strong>{% if volume.description %}<span>{{ volume.description }}</span>{% endif %}</a></li>
    {% endfor %}
  </ul>
</main>
{% endblock %}
