[graph]
all-features = true

[licenses]
# Nothing copyleft: every dependency must be under one of these.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

# The one crate under a licence that is not in the list above, named here and not admitted in
# general: the root certificates the HTTPS client of `anaquel upgrade` trusts. The licence is a
# permissive one for data; it asks that its notice travel with the data, so THIRD-PARTY.md lists
# the crate as soon as the program links the client.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of this workspace name each other by path, without a version; they are not published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
