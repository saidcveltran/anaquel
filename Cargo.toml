[workspace]
resolver = "3"
members = [
    "crates/anaquel-diagnostics",
    "crates/anaquel-schema",
    "crates/anaquel-directive",
    "crates/anaquel-catalog",
    "crates/anaquel-compose",
    "crates/anaquel-theme",
    "crates/anaquel-render",
    "crates/anaquel-assets",
    "crates/anaquel-emit",
    "crates/anaquel-search",
    "crates/anaquel-update",
    "crates/anaquel-sign",
    "crates/anaquel-upgrade",
    "crates/anaquel-pipeline",
    "crates/anaquel-preview",
    "crates/anaquel-fuzzcheck",
    "crates/anaquel",
]
# The fuzz targets need a nightly compiler and have their own lock file.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/saidcveltran/anaquel"
publish = false

[workspace.dependencies]
anaquel-diagnostics = { path = "crates/anaquel-diagnostics" }
anaquel-schema = { path = "crates/anaquel-schema" }
anaquel-directive = { path = "crates/anaquel-directive" }
anaquel-catalog = { path = "crates/anaquel-catalog" }
anaquel-compose = { path = "crates/anaquel-compose" }
anaquel-theme = { path = "crates/anaquel-theme" }
anaquel-render = { path = "crates/anaquel-render" }
anaquel-assets = { path = "crates/anaquel-assets" }
anaquel-emit = { path = "crates/anaquel-emit" }
anaquel-search = { path = "crates/anaquel-search" }
anaquel-update = { path = "crates/anaquel-update" }
anaquel-sign = { path = "crates/anaquel-sign" }
anaquel-upgrade = { path = "crates/anaquel-upgrade" }
anaquel-pipeline = { path = "crates/anaquel-pipeline" }
anaquel-preview = { path = "crates/anaquel-preview" }

axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
blake2 = "=0.11.0"
blake3 = "=1.8.7"
ed25519-compact = { version = "=2.6.1", default-features = false }
# Pure-Rust deflate, so no C library is needed on any of the five targets. The version is the
# one `syntect` already brought into the lock file, so there is still only one.
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "=0.4.3"
rpassword = "=7.5.5"
scrypt = { version = "=0.12.0", default-features = false }
zeroize = "=1.9.2"
# Blocking HTTPS client for `anaquel upgrade`. The newest release more than two weeks old
# (2026-11-02). The `rustls` feature brings the `ring` crypto provider and the root certificates
# bundled in `webpki-roots`, so nothing depends on the certificate store of the system.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
# The newest release that is more than two weeks old (2026-11-03); the crate publishes almost
# daily. Only the deflate method is built in: no encryption, no bzip2, lzma, zstd or xz.
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }
notify = "=8.2.2"
notify-debouncer-full = "=0.7.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net"] }
camino = "=1.2.6"
clap = { version = "=4.6.7", features = ["derive"] }
minisign-verify = "=0.3.0"
minijinja = { version = "=3.1.0", features = ["serde"] }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
rayon = "=1.12.0"
sha2 = "=0.11.0"
# Without `xattr`: the program reads one entry of an archive and never extracts a tree.
tar = { version = "=0.4.46", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "html", "regex-fancy"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
toml = "=1.2.1"
unicode-normalization = "=0.1.26"
walkdir = "=2.5.0"
yaml-rust2 = "=0.13.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
