[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# A SHA-256 sum next to each archive, and a build attestation of GitHub
checksum = "sha256"
github-attestations = true
# Files that travel with the program (the Apache licence asks for NOTICE)
include = ["README.md", "NOTICE", "THIRD-PARTY.md"]
# Run the release plan on pull requests; the build itself only runs on a tag
pr-run-mode = "plan"
