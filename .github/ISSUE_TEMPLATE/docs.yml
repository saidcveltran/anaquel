name: Documentation
description: Something in the documentation is wrong, missing or unclear.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The file or the heading.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested text
      description: Optional.
