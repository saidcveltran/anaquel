name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest library that shows it, or the commands you ran.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `anaquel version` and `anaquel doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `anaquel check --strict`
      description: Paste it if the problem is about a build or a diagnostic.
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, Other]
    validations:
      required: true
  - type: checkboxes
    id: private
    attributes:
      label: Before you send
      options:
        - label: The text above holds no secrets, tokens or private paths.
          required: true
