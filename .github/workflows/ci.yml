name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two ARM runners run the same steps natively, so the release builds for
        # Linux ARM64 and Windows ARM64 are tested where they will run.
        os: [ubuntu-latest, windows-latest, ubuntu-22.04-arm, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check the sample library
        run: cargo run -q --locked -p anaquel -- check examples/reference-library --strict
      - name: Check the directives library
        run: cargo run -q --locked -p anaquel -- check examples/directives --strict
      - name: Check the multi-shelf library
        run: cargo run -q --locked -p anaquel -- check examples/multi-shelf --strict
      - name: Check the bilingual library
        run: cargo run -q --locked -p anaquel -- check examples/bilingual --strict
      - name: Update fixtures match their generator
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/fixtures-venv"
          "$RUNNER_TEMP/fixtures-venv/bin/python" -m pip install --quiet cryptography
          "$RUNNER_TEMP/fixtures-venv/bin/python" -I tools/update_fixtures.py --check
      - name: Third-party list is up to date
        if: matrix.os == 'ubuntu-latest'
        run: python3 -I tools/third_party.py --check
      - name: Five-minute example from the README
        shell: bash
        run: |
          cargo build --locked -p anaquel
          bin="$PWD/target/debug/anaquel"
          cd "$RUNNER_TEMP"
          "$bin" new my-docs --title "My docs"
          "$bin" check my-docs --strict
          "$bin" build my-docs --no-search
          test -f my-docs/dist/index.html

  # The tests again, against the C library the static Linux build uses.
  test-musl:
    name: test (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install the musl compiler wrapper
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Test
        run: cargo test --workspace --locked --target x86_64-unknown-linux-musl

  install-smoke:
    name: install smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl compiler wrapper
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dist
        run: cargo install cargo-dist --locked --version 0.34.0
      - name: Build the release archive of this system
        run: dist build --artifacts=local --target ${{ matrix.target }}
      - name: Unpack it and run the program from there
        shell: bash
        run: |
          archive="$(ls target/distrib/anaquel-${{ matrix.target }}.* | grep -v '\.sha256$' | head -n 1)"
          python -I tools/install_smoke.py "$archive" --sums "$archive.sha256"
      - name: The static Linux build has no dynamic dependencies
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          archive="$(ls target/distrib/anaquel-${{ matrix.target }}.* | grep -v '\.sha256$' | head -n 1)"
          unpacked="$(mktemp -d)"
          tar -xJf "$archive" -C "$unpacked"
          program="$(find "$unpacked" -type f -name anaquel | head -n 1)"
          file "$program"
          file "$program" | grep -E 'statically linked|static-pie linked'

  images:
    name: image metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No metadata in images
        run: python3 -I tools/check_images.py

  gates:
    name: naming and public gates
    runs-on: ubuntu-latest
    steps:
      # A pull request is checked at its own head: the merge commit GitHub makes for the
      # check is signed with the author's profile e-mail, which is not part of the history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Tests of the gates
        run: python3 -I tools/test_gates.py
      - name: Names say what things are for
        run: python3 -I tools/naming_gate.py
      - name: Nothing private in the tree or in the history
        run: python3 -I tools/public_gate.py

  fuzz:
    name: fuzz (10 minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository pins the stable compiler; the fuzzer needs a nightly one next to it.
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install the nightly compiler
        run: rustup toolchain install nightly-2026-11-01 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz each target for 150 seconds
        run: |
          for target in directive_grammar front_matter url_policy link_resolver; do
            cargo +nightly-2026-11-01 fuzz run "$target" -- -max_total_time=150 -rss_limit_mb=2048
          done
      - name: Keep what a failure found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
