name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check the sample library
        run: cargo run -q --locked -p anaquel -- check examples/reference-library --strict
      - name: Five-minute example from the README
        shell: bash
        run: |
          cargo build --locked -p anaquel
          bin="$PWD/target/debug/anaquel"
          cd "$RUNNER_TEMP"
          "$bin" new my-docs --title "My docs"
          "$bin" check my-docs --strict
          "$bin" build my-docs --no-search
          test -f my-docs/dist/index.html

  images:
    name: image metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No metadata in images
        run: python3 -I tools/check_images.py

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
