name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check the sample library
        run: cargo run -q --locked -p anaquel -- check examples/reference-library --strict
      - name: Five-minute example from the README
        shell: bash
        run: |
          cargo build --locked -p anaquel
          bin="$PWD/target/debug/anaquel"
          cd "$RUNNER_TEMP"
          "$bin" new my-docs --title "My docs"
          "$bin" check my-docs --strict
          "$bin" build my-docs --no-search
          test -f my-docs/dist/index.html

  install-smoke:
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dist
        run: cargo install cargo-dist --locked --version 0.34.0
      - name: Build the release archive of this system
        run: dist build --artifacts=local --target ${{ matrix.target }}
      - name: Unpack it and run the program from there
        shell: bash
        run: |
          archive="$(ls target/distrib/anaquel-${{ matrix.target }}.* | grep -v '\.sha256$' | head -n 1)"
          python -I tools/install_smoke.py "$archive" --sums "$archive.sha256"

  images:
    name: image metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No metadata in images
        run: python3 -I tools/check_images.py

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
